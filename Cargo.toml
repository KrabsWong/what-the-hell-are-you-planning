[package]
name = "what-the-hell-are-you-planning"
version = "0.0.1"
edition = "2024"

[features]
qa = ["gpui-kit/test-support"]

[dependencies]
markdown = "=1.0.0"
gpui-kit = { version = "=0.9.1", features = ["gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
latex-rust = "=3.0.1"
usvg = "0.46"
chrono-tz = "0.10"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["gpui-fast", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGlassEffectView", "NSColor", "NSView", "NSResponder", "NSWindow", "NSWorkspace", "NSAccessibility", "objc2-core-foundation"] }
raw-window-handle = { version = "0.6.2" }

[profile.dev]
debug = 0
# The normal app launcher uses this profile; optimize UI layout and painting.
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

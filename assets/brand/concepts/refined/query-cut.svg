<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" style="color:var(--logo-ink,#c7a36b)" role="img" aria-label="断问 · 精修版"><title>断问 · 精修版</title><desc>收紧问号轮廓，扩大落点间距。主体轻移后归位，落点微抬确认，随后长停顿。</desc><style>@keyframes refined-query-body{0%,16%,48%,100%{transform:translateX(0)}28%,34%{transform:translateX(3px)}}
@keyframes refined-query-dot{0%,38%,64%,100%{transform:translateY(0)}49%,53%{transform:translateY(-2px)}}
.refined-query-body{animation:refined-query-body 8s cubic-bezier(.4,0,.2,1) infinite}.refined-query-dot{animation:refined-query-dot 8s cubic-bezier(.4,0,.2,1) infinite}
@media(prefers-reduced-motion:reduce){.mark-motion{animation:none!important}}</style><g fill="currentColor"><path class="mark-motion refined-query-body" d="M24 48V16H104V62L74 82V84H54V70L84 50V36H44V48Z"/><path class="mark-motion refined-query-dot" d="M54 96H74V116H54Z"/></g></svg>
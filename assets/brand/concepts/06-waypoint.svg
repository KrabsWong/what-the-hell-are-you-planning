<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="路径 W">
<title>路径 W · WAYPOINT</title><desc>把模糊的想法，走成可执行的路径。光迹沿 W 行进，在终点短暂停留。</desc>
<style>

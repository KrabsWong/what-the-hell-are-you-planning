<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552.53 485" width="552.53" height="485" style="--bg:#18181B;--fg:#FAFAFA;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="loop" data-label="Collect evidence">
  <rect x="178.892" y="118" width="247.30199999999996" height="100" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="178.892" y="118" width="135.13" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="184.892" y="127" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [Collect evidence]</text>
</g>
<g class="block" data-type="alt" data-label="Sufficient evidence">
  <rect x="30" y="241" width="257.676" height="194" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="241" width="136.45000000000002" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="250" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [Sufficient evidence]</text>
  <line x1="30" y1="387" x2="287.676" y2="387" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="401" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[Evidence gaps]</text>
</g>
<line class="lifeline" data-actor="U" x1="93.28399999999999" y1="70" x2="93.28399999999999" y2="455" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="233.284" y1="70" x2="233.284" y2="455" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="373.284" y1="70" x2="373.284" y2="455" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<rect class="activation" data-actor="S" x="368.284" y="158" width="10" height="40" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect class="activation" data-actor="A" x="228.284" y="90" width="10" height="261" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<g class="message" data-from="U" data-to="A" data-label="Research topic" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="93.28399999999999" y1="90" x2="233.284" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="163.284" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Research topic</text>
</g>
<g class="message" data-from="A" data-to="S" data-label="Search" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="233.284" y1="158" x2="373.284" y2="158" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="303.284" y="148" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Search</text>
</g>
<g class="message" data-from="S" data-to="A" data-label="Evidence" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="373.284" y1="198" x2="233.284" y2="198" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="303.284" y="188" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Evidence</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="Review findings" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="233.284,281 263.284,281 263.284,301 233.284,301" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="271.284" y="291" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Review findings</text>
</g>
<g class="message" data-from="A" data-to="U" data-label="Report" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="233.284" y1="351" x2="93.28399999999999" y2="351" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="163.284" y="341" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Report</text>
</g>
<g class="message" data-from="A" data-to="U" data-label="Explain limitations" data-line-style="dashed" data-arrow-head="open" data-self="false">
  <line x1="233.284" y1="415" x2="93.28399999999999" y2="415" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow-open)" />
  <text x="163.284" y="405" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Explain limitations</text>
</g>
<g class="note" data-position="right" data-actors="S">
  <polygon points="426.19399999999996,206 516.53,206 522.53,212 522.53,229 426.19399999999996,229" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="516.53,206 522.53,212 516.53,212" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="474.36199999999997" y="217.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Retain citations</text>
</g>
<g class="actor" data-id="U" data-label="Researcher" data-type="actor">
  <g transform="translate(75.28399999999999,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="93.28399999999999" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Researcher</text>
</g>
<g class="actor" data-id="A" data-label="Assistant" data-type="participant">
  <rect x="188.892" y="30" width="88.78399999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="233.284" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Assistant</text>
</g>
<g class="actor" data-id="S" data-label="Sources" data-type="participant">
  <rect x="330.374" y="30" width="85.82" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="373.284" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Sources</text>
</g>
</svg>
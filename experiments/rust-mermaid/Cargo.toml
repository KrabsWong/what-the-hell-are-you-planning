[package]
name = "beautiful-mermaid-rs"
version = "0.1.0"
description = "Native Rust Mermaid diagrams with Beautiful Mermaid layout and SVG styling"
license = "MIT"
edition = "2024"
publish = false
include = ["src/**", "tests/**", "fixtures/**", "tools/**", "licenses/**", "examples/**", "Cargo.toml", "Cargo.lock", "LICENSE", "*.md", "UPSTREAM.json"]

[dependencies]
elk-layout = "=0.12.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"

[workspace]

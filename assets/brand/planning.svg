<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" style="color:var(--logo-ink,#c7a36b)" role="img" aria-label="构序 · 精修版"><title>构序 · 精修版</title><desc>四条等宽模块围合成开放方形，六单位间隙保留辨识度。模块依次舒展再归位，随后长停顿。</desc><style>@keyframes refined-assembly-0{0%,12%,44%,100%{transform:translate(0,0)}22%,30%{transform:translate(-3px,-3px)}}.refined-assembly-0{animation:refined-assembly-0 9s cubic-bezier(.4,0,.2,1) infinite}@keyframes refined-assembly-1{0%,16%,48%,100%{transform:translate(0,0)}26%,34%{transform:translate(3px,-3px)}}.refined-assembly-1{animation:refined-assembly-1 9s cubic-bezier(.4,0,.2,1) infinite}@keyframes refined-assembly-2{0%,20%,52%,100%{transform:translate(0,0)}30%,38%{transform:translate(3px,3px)}}.refined-assembly-2{animation:refined-assembly-2 9s cubic-bezier(.4,0,.2,1) infinite}@keyframes refined-assembly-3{0%,24%,56%,100%{transform:translate(0,0)}34%,42%{transform:translate(-3px,3px)}}.refined-assembly-3{animation:refined-assembly-3 9s cubic-bezier(.4,0,.2,1) infinite}
@media(prefers-reduced-motion:reduce){.mark-motion{animation:none!important}}</style><g fill="currentColor"><g class="mark-motion refined-assembly-0"><path transform="rotate(0 64 64)" d="M44 18H110V38H44Z"/></g><g class="mark-motion refined-assembly-1"><path transform="rotate(90 64 64)" d="M44 18H110V38H44Z"/></g><g class="mark-motion refined-assembly-2"><path transform="rotate(180 64 64)" d="M44 18H110V38H44Z"/></g><g class="mark-motion refined-assembly-3"><path transform="rotate(270 64 64)" d="M44 18H110V38H44Z"/></g></g></svg>
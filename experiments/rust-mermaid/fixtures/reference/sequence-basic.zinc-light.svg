<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 542.53 393" width="542.53" height="393" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="loop" data-label="Collect evidence">
  <rect x="168.892" y="118" width="247.30199999999996" height="100" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="168.892" y="118" width="135.13" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="174.892" y="127" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [Collect evidence]</text>
</g>
<line class="lifeline" data-actor="U" x1="83.28399999999999" y1="70" x2="83.28399999999999" y2="363" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="223.284" y1="70" x2="223.284" y2="363" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="363.284" y1="70" x2="363.284" y2="363" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<rect class="activation" data-actor="S" x="358.284" y="158" width="10" height="40" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect class="activation" data-actor="A" x="218.284" y="90" width="10" height="233" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<g class="message" data-from="U" data-to="A" data-label="Research topic" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="83.28399999999999" y1="90" x2="223.284" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="153.284" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Research topic</text>
</g>
<g class="message" data-from="A" data-to="S" data-label="Search" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="223.284" y1="158" x2="363.284" y2="158" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="293.284" y="148" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Search</text>
</g>
<g class="message" data-from="S" data-to="A" data-label="Evidence" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="363.284" y1="198" x2="223.284" y2="198" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="293.284" y="188" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Evidence</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="Review findings" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="223.284,253 253.284,253 253.284,273 223.284,273" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="261.284" y="263" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Review findings</text>
</g>
<g class="message" data-from="A" data-to="U" data-label="Report" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="223.284" y1="323" x2="83.28399999999999" y2="323" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="153.284" y="313" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Report</text>
</g>
<g class="note" data-position="right" data-actors="S">
  <polygon points="416.19399999999996,206 506.53,206 512.53,212 512.53,229 416.19399999999996,229" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="506.53,206 512.53,212 506.53,212" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="464.36199999999997" y="217.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Retain citations</text>
</g>
<g class="actor" data-id="U" data-label="Researcher" data-type="participant">
  <rect x="29.999999999999993" y="30" width="106.568" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="83.28399999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Researcher</text>
</g>
<g class="actor" data-id="A" data-label="Assistant" data-type="participant">
  <rect x="178.892" y="30" width="88.78399999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="223.284" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Assistant</text>
</g>
<g class="actor" data-id="S" data-label="Sources" data-type="participant">
  <rect x="320.374" y="30" width="85.82" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="363.284" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Sources</text>
</g>
</svg>
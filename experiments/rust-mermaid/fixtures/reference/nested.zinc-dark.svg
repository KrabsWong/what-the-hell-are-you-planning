<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1185.352 409.994" width="1185.352" height="409.994" style="--bg:#18181B;--fg:#FAFAFA;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Pipeline" data-label="Research pipeline">
  <rect x="233.021" y="40" width="771.921" height="329.994" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="233.021" y="40" width="771.921" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="245.021" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Research pipeline</text>
<g class="subgraph" data-id="Analysis" data-label="Evidence analysis">
  <rect x="279.02099999999996" y="84" width="379.07800000000003" height="243.769" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="279.02099999999996" y="84" width="379.07800000000003" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="291.02099999999996" y="98" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Evidence analysis</text>
</g>
</g>
<polyline class="edge" data-from="Intake" data-to="Extract" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="617.0852500000001,295.544 572.008,295.544 572.008,297.769 28,297.769 28,179.8845 62,179.8845" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Review" data-to="Draft" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Yes" points="571.4708333333334,149.25633333333334 617.0852500000001,149.25633333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Review" data-to="Intake" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="More evidence" points="632.7271666666667,210.5126666666667 572.008,210.5126666666667 572.008,286.319 617.0852500000001,286.319" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Start" data-to="Intake" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="179.021,350.769 805.029,350.769 805.029,344.769 850.10625,344.769" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Draft" data-to="Done" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="961.7102500000001,189.25633333333332 1058.942,189.25633333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Extract" data-to="Review" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="410.33,219.8845 458.33,219.8845" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Review" data-to="Draft" data-label="Yes">
  <rect x="501.214" y="133.25633333333332" width="36.658" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="519.543" y="148.40633333333332" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Yes</text>
</g>
<g class="edge-label" data-from="Review" data-to="Intake" data-label="More evidence">
  <rect x="475.0780000000001" y="194.5126666666667" width="88.93" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="519.5430000000001" y="209.6626666666667" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">More evidence</text>
</g>
<g class="node" data-id="Start" data-label="Receive request" data-shape="rectangle">
  <rect x="40" y="332.319" width="139.021" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="109.5105" y="350.769" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Receive request</text>
</g>
<g class="node" data-id="Done" data-label="Publish" data-shape="stadium">
  <rect x="1058.942" y="170.80633333333333" width="86.41" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1102.147" y="189.25633333333332" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Publish</text>
</g>
<g class="node" data-id="Intake" data-label="Prepare materials" data-shape="rectangle">
  <rect x="850.10625" y="317.09400000000005" width="147.913" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="924.06275" y="335.54400000000004" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Prepare materials</text>
</g>
<g class="node" data-id="Draft" data-label="Write report" data-shape="rectangle">
  <rect x="850.10625" y="170.80633333333333" width="111.604" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="905.9082500000001" y="189.25633333333332" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Write report</text>
</g>
<g class="node" data-id="Extract" data-label="Extract facts" data-shape="rectangle">
  <rect x="295.02099999999996" y="201.4345" width="115.30900000000001" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="352.67549999999994" y="219.8845" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Extract facts</text>
</g>
<g class="node" data-id="Review" data-label="Evidence sufficient?" data-shape="diamond">
  <polygon points="550.2145,128 642.099,219.8845 550.2145,311.769 458.33000000000004,219.8845" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="550.2145" y="219.8845" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Evidence sufficient?</text>
</g>
</svg>